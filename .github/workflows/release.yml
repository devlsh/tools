name: "🚀 release"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        type: choice
        options:
          - prepare
          - publish
      bootstrap:
        description: "Temporary authentication for the initial npm publication"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: tools-release
  cancel-in-progress: false

jobs:
  release:
    name: "🏷️ prepare or create"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: "🛡️ validate release dispatch"
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          case "$OPERATION" in
            prepare|publish) ;;
            *) echo "Operation must be prepare or publish" >&2; exit 1 ;;
          esac
          if [[ "$OPERATION" == prepare && "$BOOTSTRAP" == true ]]; then
            echo "Bootstrap authentication is only available for publish" >&2
            exit 1
          fi

      - name: "🛡️ require bootstrap credential"
        if: inputs.operation == 'publish' && inputs.bootstrap
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_BOOTSTRAP_TOKEN:-}" ]]; then
            echo "NPM_BOOTSTRAP_TOKEN must be configured for bootstrap publication" >&2
            exit 1
          fi

      - name: "🏷️ prepare or create release"
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.operation == 'prepare' }}
          skip-github-pull-request: ${{ inputs.operation == 'publish' }}

  publish:
    name: "📦 publish package"
    needs: release
    if: inputs.operation == 'publish' && needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: "📥 check out release"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      - name: "⚙️ set up devenv"
        uses: ./.github/actions/setup-devenv

      - name: "📦 publish"
        if: ${{ !inputs.bootstrap }}
        run: devenv --no-tui shell -- pnpm publish --access public --tag latest --provenance --no-git-checks

      - name: "📦 bootstrap publish"
        if: inputs.bootstrap
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_BOOTSTRAP_TOKEN:-}" ]]; then
            echo "NPM_BOOTSTRAP_TOKEN must be configured for bootstrap publication" >&2
            exit 1
          fi
          umask 077
          NPM_CONFIG_USERCONFIG=$(mktemp "$RUNNER_TEMP/npm-bootstrap.XXXXXX")
          export NPM_CONFIG_USERCONFIG
          # Keep the environment placeholder literal so the file never stores the token.
          # shellcheck disable=SC2016
          printf '%s\n' 'registry=https://registry.npmjs.org/' '//registry.npmjs.org/:_authToken=${NPM_BOOTSTRAP_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          devenv --no-tui shell -- pnpm publish --access public --tag latest --provenance --no-git-checks
