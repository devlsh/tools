name: "🔎 ast rule tests"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ast-rule-tests.yml"
      - "github/setup/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "sgconfig.yml"
      - "oxfmt.config.ts"
      - "ast-grep/**"
      - "src/**"
      - "*.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ast-rule-tests.yml"
      - "github/setup/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "sgconfig.yml"
      - "oxfmt.config.ts"
      - "ast-grep/**"
      - "src/**"
      - "*.ts"

permissions:
  contents: read

jobs:
  ast-tests:
    name: "🔎 ast tests"
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ast-rule-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: "📥 check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "⚙️ set up node and pnpm"
        uses: ./github/setup

      - name: "🔎 test rules"
        run: pnpm ast:test

      - name: "🧹 scan repository"
        run: pnpm ast:scan

  update-snapshots:
    name: "🔎 update snapshots"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: ast-rule-snapshots
      cancel-in-progress: false
    steps:
      - name: "🛡️ require default branch"
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: "📥 check out default branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: "⚙️ set up node and pnpm"
        uses: ./github/setup

      - name: "🔄 update snapshots"
        run: pnpm ast:test:update

      - name: "🎨 format snapshots"
        run: pnpm exec oxfmt --write 'ast-grep/tests/__snapshots__/*.yml'

      - name: "🎨 check snapshot formatting"
        run: pnpm exec oxfmt --check 'ast-grep/tests/__snapshots__/*.yml'

      - name: "🔎 verify rules"
        run: pnpm ast:test

      - name: "🧹 scan repository"
        run: pnpm ast:scan

      - name: "🔀 snapshot pull request"
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          LEFTHOOK: "0"
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: automation/ast-grep-snapshots
          add-paths: ast-grep/tests/__snapshots__/**
          sign-commits: true
          commit-message: "test: update ast-grep snapshots"
          title: "test: update ast-grep snapshots"
          body: |
            Updates verified ast-grep snapshots.

            Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: "📝 record result"
        shell: bash
        env:
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
          SOURCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'Snapshot PR: %s\nHead: %s\nSource run: %s\n' "$PR_URL" "$PR_HEAD_SHA" "$SOURCE_RUN" >> "$GITHUB_STEP_SUMMARY"
