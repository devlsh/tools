id: no-set-immediate-promise-waits
valid:
  - |
    await delivery.completed;
  - |
    await pubSubIdle();
  - |
    scheduleProductionDelivery(() => setImmediate(flush));
  - |
    test('documents setImmediate event loop ordering', async () => {
      await new Promise<void>((resolve) => setImmediate(resolve));
    });
invalid:
  - |
    await new Promise((resolve) => setImmediate(resolve));
  - |
    await new Promise<void>((resolve) => setImmediate(resolve));
  - |
    await new Promise((resolve, reject) => setImmediate(resolve));
  - |
    await new Promise<void>((resolve, reject) => setImmediate(resolve));
  - |
    await new Promise((resolve) => {
      setImmediate(resolve);
    });
  - |
    await new Promise<void>((resolve) => {
      setImmediate(resolve);
    });
  - |
    await new Promise((resolve, reject) => {
      setImmediate(resolve);
    });
  - |
    await new Promise<void>((resolve, reject) => {
      setImmediate(resolve);
    });
