id: no-error-factory-helpers
valid:
  - |
    function connectRoom(connected: boolean) {
      if (!connected) {
        return Result.err(new RoomConnectionError({ message: 'Room failed' }));
      }

      return Result.ok();
    }
  - |
    const createErrorMessage = (error: unknown) => String(error);
invalid:
  - |
    function createRoomError(cause: unknown) {
      return new RoomConnectionError({ message: 'Room failed', cause });
    }
  - |
    const makeValidationFailure = (message: string) => new ValidationFailure({ message });
  - |
    function createConfigError() {
      throw new InvalidConfigError({ message: 'Invalid config' });
    }
  - |
    function lifecycleError(code: GameLifecycleErrorCode, message: string, retryable = false) {
      return new GameLifecycleError({ code, message, retryable });
    }
  - |
    function invalidPresenceRecord(context: string): PresenceError {
      return new PresenceError({ message: `Invalid ${context}` });
    }
  - |
    function unauthorized() {
      return Result.err(new GameCommandError({ code: 'UNAUTHORIZED', message: 'Permission denied' }));
    }
  - |
    const notJoined = () => Result.err(new GameCommandFailure({ code: 'NOT_JOINED' }));
