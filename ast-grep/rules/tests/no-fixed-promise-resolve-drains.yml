id: no-fixed-promise-resolve-drains
language: TypeScript
severity: warning
message: Prefer an observable idle/completion promise over fixed Promise.resolve microtask drains.
files:
  - '**/*.{test,spec}.{ts,tsx}'
  - '**/tests/**/*.{ts,tsx}'
utils:
  promiseResolveAwait:
    pattern: await Promise.resolve();
  loopStatement:
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
rule:
  any:
    - all:
        - matches: promiseResolveAwait
        - precedes:
            matches: promiseResolveAwait
            stopBy: neighbor
    - all:
        - matches: loopStatement
        - has:
            matches: promiseResolveAwait
            stopBy: end
