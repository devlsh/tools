id: no-runtime-freeze-tsx
language: Tsx
severity: error
message: Runtime object freezing is not an approved shared-reference contract.
note: Runtime freezing requires a documented shared-reference contract with observable mutation rejection and matching shallow or deep enforcement.
files:
  - '**/*.tsx'
rule:
  all:
    - kind: call_expression
    - regex: "^(?:globalThis\\.)?Object(?:\\.freeze|\\[['\"]freeze['\"]\\])(?:<[\\s\\S]*>)?\\("
